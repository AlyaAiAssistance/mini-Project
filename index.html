    /* SVG Path Marquee Animation */
    @keyframes marqueePath {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    .animate-marquee-path {
      animation: marqueePath 20s linear infinite;
    }
    @keyframes marqueeLoopPath {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    .animate-marquee-loop {
      animation: marqueeLoopPath 25s linear infinite;
      offset-rotate: auto;
    }
    .animate-marquee-loop:hover {
      animation-play-state: paused;
    }

    /* Loader Styles from Uiverse.io by SelfMadeSystem */ 
    .absolute {
      position: absolute;
    }
    .inline-block {
      display: inline-block;
    }
    .loader {
      display: flex;
      margin: 0.25em 0;
    }
    .w-2 {
      width: 0.5em;
    }
    .dash {
      animation: dashArray 2s ease-in-out infinite,
        dashOffset 2s linear infinite;
    }
    .spin {
      animation: spinDashArray 2s ease-in-out infinite,
        spin 8s ease-in-out infinite,
        dashOffset 2s linear infinite;
      transform-origin: center;
    }
    @keyframes dashArray {
      0% {
        stroke-dasharray: 0 1 359 0;
      }
      50% {
        stroke-dasharray: 0 359 1 0;
      }
      100% {
        stroke-dasharray: 359 1 0 0;
      }
    }
    @keyframes spinDashArray {
      0% {
        stroke-dasharray: 270 90;
      }
      50% {
        stroke-dasharray: 0 360;
      }
      100% {
        stroke-dasharray: 270 90;
      }
    }
    @keyframes dashOffset {
      0% {
        stroke-dashoffset: 365;
      }
      100% {
        stroke-dashoffset: 5;
      }
    }
    @keyframes spin {
      0% {
        rotate: 0deg;
      }
      12.5%,
      25% {
        rotate: 270deg;
      }
      37.5%,
      50% {
        rotate: 540deg;
      }
      62.5%,
      75% {
        rotate: 810deg;
      }
      87.5%,
      100% {
        rotate: 1080deg;
      }
    }

    /* Preloader Overlay Styles */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .preloader-title {
      color: #f8fafc;
      font-family: 'Sora', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00E0ED, #973BED, #FFC800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 2s ease-in-out infinite;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
    .letter-svg {
      width: 32px;
      height: 32px;
      fill: none;
    }
    @media (min-width: 640px) {
      .letter-svg {
        width: 52px;
        height: 52px;
      }
    }
    @media (min-width: 1024px) {
      .letter-svg {
        width: 64px;
        height: 64px;
      }
    }
    /* From Uiverse.io by catraco */ 
    .btn-class-name {
      --primary: 255, 65, 84;
      --secondary: 150, 30, 45;
      width: 130px;
      height: 130px;
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      outline: 10px solid rgba(var(--primary), .4);
      border-radius: 100%;
      position: relative;
      transition: .3s;
    }

    .btn-class-name .back {
      background: rgb(var(--secondary));
      border-radius: 100%;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .btn-class-name .front {
      background: linear-gradient(0deg, rgba(var(--primary), .7) 20%, rgba(var(--primary)) 50%);
      box-shadow: 0 .5em 1em -0.2em rgba(var(--secondary), .5);
      border-radius: 100%;
      position: absolute;
      border: 2px solid rgb(var(--secondary));
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 800;
      font-family: inherit;
      transform: translateY(-15%);
      transition: .15s;
      color: #ffffff;
    }

    .btn-class-name:active .front {
      transform: translateY(0%);
      box-shadow: 0 0;
    }

    /* From Uiverse.io by marcelodolza (Pearl Button - Brand Blue Edition) */ 
    .pearl-btn {
      --white: #ffffff;
      --bg: #0765d6;
      --radius: 100px;
      outline: none;
      cursor: pointer;
      border: 0;
      position: relative;
      border-radius: var(--radius);
      background-color: var(--bg);
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
      box-shadow:
        inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.45),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.6),
        0 1rem 2rem -0.4rem rgba(7, 101, 214, 0.4);
    }
    .pearl-btn.w-full {
      display: block;
      width: 100%;
      text-align: center;
    }
    .pearl-btn .wrap {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      padding: 13px 32px;
      border-radius: inherit;
      position: relative;
      overflow: hidden;
    }
    .pearl-btn.w-full .wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pearl-btn-sm .wrap {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      padding: 9px 22px;
    }

    .pearl-btn .wrap p {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      transition: all 0.2s ease;
      transform: translateY(2%);
    }
    .pearl-btn .wrap::before,
    .pearl-btn .wrap::after {
      content: "";
      position: absolute;
      transition: all 0.3s ease;
    }
    .pearl-btn .wrap::before {
      left: -15%;
      right: -15%;
      bottom: 25%;
      top: -100%;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.22);
    }
    .pearl-btn .wrap::after {
      left: 6%;
      right: 6%;
      top: 12%;
      bottom: 40%;
      border-radius: 22px 22px 0 0;
      box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.9);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(0, 0, 0, 0) 50%,
        rgba(0, 0, 0, 0) 100%
      );
    }
    .pearl-btn:hover {
      box-shadow:
        inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.65),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.8),
        0 1.4rem 2.4rem -0.4rem rgba(7, 101, 214, 0.5);
    }
    .pearl-btn:hover .wrap::before {
      transform: translateY(-5%);
    }
    .pearl-btn:hover .wrap::after {
      opacity: 0.6;
      transform: translateY(5%);
    }
    .pearl-btn:hover .wrap p {
      transform: translateY(-4%);
    }
    .pearl-btn:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.6),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.6),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.5),
        0 0.8rem 1.5rem -0.4rem rgba(7, 101, 214, 0.4);
    }

    /* From Uiverse.io by Galahhad - BB8 Star Wars Theme Toggle */ 
    .bb8-toggle {
      --toggle-size: 6px;
      --toggle-width: 10.625em;
      --toggle-height: 5.625em;
      --toggle-offset: calc((var(--toggle-height) - var(--bb8-diameter)) / 2);
      --toggle-bg: linear-gradient(#2c4770, #070e2b 35%, #628cac 50% 70%, #a6c5d4) no-repeat;
      --bb8-diameter: 4.375em;
      --radius: 99em;
      --transition: 0.4s;
      --accent: #de7d2f;
      --bb8-bg: #fff;
      display: inline-block;
      cursor: pointer;
      font-size: var(--toggle-size);
      user-select: none;
      vertical-align: middle;
    }

    .bb8-toggle,
    .bb8-toggle *,
    .bb8-toggle *::before,
    .bb8-toggle *::after {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    .bb8-toggle__checkbox {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      display: none;
    }

    .bb8-toggle__container {
      width: var(--toggle-width);
      height: var(--toggle-height);
      background: var(--toggle-bg);
      background-size: 100% 11.25em;
      background-position-y: -5.625em;
      border-radius: var(--radius);
      position: relative;

      transform: translate(0, 0);
      box-shadow: 0 0 0 2px var(--stone-50);

    .wave-btn p {

      font-weight: 700;
      text-align: center;
      z-index: 2;
      position: relative;
      padding: 0 1.25rem;

    .wave-btn::after {
      position: absolute;
      content: "";
      width: 100%;
      z-index: 1;
      height: 12%;
      bottom: 0;
      left: 0;

        90% 94%,
        94% 96%,
        98% 98%,
        100% 100%,
        82% 100%,
        0 100%
      );
      background: #60a5fa;
      transition: 0.3s ease;
    }

    .wave-btn::before {
      position: absolute;
      content: "";
      transform: rotate(180deg);

      height: 12%;

      left: 0;

    /* From Uiverse.io by ke1221 (Neumorphic Soft 3D Button) */ 
    .neu-btn {
      color: #090909;
      padding: 0.55em 1.25em;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 0.6em;
      background: #e8e8e8;
      cursor: pointer;
      border: 1px solid #e8e8e8;
      transition: all 0.3s ease;
      box-shadow: 5px 5px 10px #c5c5c5, -5px -5px 10px #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      text-decoration: none;
      font-family: inherit;
    }

    .neu-btn:hover {
      transform: translateY(-1px);
      box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff;
    }

    .neu-btn:active {
      color: #444;
      transform: translateY(0);
      box-shadow: inset 4px 4px 10px #c5c5c5, inset -4px -4px 10px #ffffff;
    }

    .dark .neu-btn {
      color: #e2e8f0;
      background: #0f1c2c;
      border-color: #0f1c2c;
      box-shadow: 5px 5px 10px #050b12, -5px -5px 10px #192d46;
    }

    .dark .neu-btn:hover {
      box-shadow: 6px 6px 12px #04090f, -6px -6px 12px #1c334f;
    }

    .dark .neu-btn:active {
      color: #94a3b8;
      box-shadow: inset 4px 4px 10px #050b12, inset -4px -4px 10px #192d46;
    }

    /* Clean Admin Login Form Card */ 
    .novaxlo-form {
      --novaxlo-purple: #0765d6;
      --novaxlo-dark: #053b7e;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      width: 100%;
      max-width: 23.5em;
      margin: 1.5rem auto;
      border: 2px solid var(--novaxlo-dark);
      border-bottom-left-radius: 1.5em;
      border-top-right-radius: 1.5em;
      box-shadow:
        -10px 0px 0px var(--novaxlo-dark),
        -10px 5px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      position: relative;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .dark .novaxlo-form {
      background-color: #0b1f2e;
      border-color: #0765d6;
      box-shadow:
        -10px 0px 0px #0765d6,
        -10px 5px 20px rgba(0, 0, 0, 0.4);
    }

    /* Phone, Tablet, & Laptop Responsiveness Optimization */
    @media (max-width: 640px) {
      .bb8-toggle {
        --toggle-size: 5px;
      }
      .pearl-btn-sm {
        font-size: 11px;
      }
      .dot-retro-btn {
        font-size: 0.85rem;
      }
      .wave-btn {
        min-width: 130px;
        height: 38px;
      }
      .wave-btn p {
        font-size: 0.85rem;
        padding: 0 0.8rem;
      }
      .neu-btn {
        padding: 0.45em 0.9em;
        font-size: 0.82rem;
      }
      .novaxlo-form {
        max-width: 100%;
        margin: 1rem 0;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .bb8-toggle {
        --toggle-size: 6px;
      }
    }

    // Helper functions
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString();
      } catch {
        return iso;
      }
    }

    function downloadJSON(filename, obj) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function sha256(message) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(message));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function ensureAdmin() {

    async function copyToClipboard(text) {
      if (!text) return false;
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch {
        document.body.removeChild(ta);
        return false;
      }
    }

    function getPosition(timeout = 6000) {
      return new Promise((resolve) => {
        if (!('geolocation' in navigator)) return resolve('unavailable');
        const timer = setTimeout(() => resolve('unavailable'), timeout + 500);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`);
          },
          () => {
            clearTimeout(timer);
            resolve('permission denied');
          },
          { timeout, maximumAge: 60000 }
        );
      });
    }

    // SOS Demo Component
    function SosDemo() {
      const [progress, setProgress] = useState(0);
      const [sent, setSent] = useState(false);
      const raf = useRef(null);
      const start = useRef(0);

      const stop = () => {
        if (raf.current) cancelAnimationFrame(raf.current);
        raf.current = null;
        if (!sent) setProgress(0);
      };

      const begin = () => {
        if (sent) {
          setSent(false);
          setProgress(0);
        }
        start.current = performance.now();
        const tick = (t) => {
          const p = Math.min(1, (t - start.current) / 3000);
          setProgress(p);
          if (p >= 1) {
            setSent(true);
            raf.current = null;
            return;
          }
          raf.current = requestAnimationFrame(tick);
        };
        raf.current = requestAnimationFrame(tick);
      };

      useEffect(() => () => stop(), []);

      return (

    // 21st.dev Forest ASCII / Pixel Art Background Canvas Effect
    function AsciiForestCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let time = 0;
        const forestChars = ["█", "▓", "▒", "░", "▲", "↟", "🌲", "✦", "*", "+", "."];

        const resize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          canvas.width = parent.clientWidth;
          canvas.height = parent.clientHeight;
        };

        resize();
        window.addEventListener('resize', resize);

        const render = () => {
          time += 1.2;
          const width = canvas.width;
          const height = canvas.height;
          if (!width || !height) {
            animationFrameId = requestAnimationFrame(render);
            return;
          }

          ctx.clearRect(0, 0, width, height);
          const cellSize = 10;
          const cols = Math.ceil(width / cellSize);
          const rows = Math.ceil(height / cellSize);

          ctx.font = '9px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const isDark = document.documentElement.classList.contains('dark');
          const baseHue = 205; // brand blue tint (#3ca6ff)

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const x = c * cellSize;
              const y = r * cellSize;

              const wave1 = Math.sin(c * 0.12 + r * 0.08 + time * 0.03);
              const wave2 = Math.cos(c * 0.07 - r * 0.14 + time * 0.02);
              const val = (wave1 + wave2 + 2) / 4;

              const isDust = Math.sin(c * 91 + r * 37 + time * 0.5) > 0.985;

              if (val > 0.08 || isDust) {
                const charIdx = Math.floor(val * (forestChars.length - 1));
                const glyph = isDust ? '✦' : forestChars[charIdx];
                const alpha = Math.min(0.5, 0.1 + val * 0.35).toFixed(2);

                if (isDark) {
                  ctx.fillStyle = `hsla(${baseHue + val * 25}, 85%, 65%, ${alpha})`;
                } else {
                  ctx.fillStyle = `hsla(${baseHue}, 80%, 45%, ${alpha})`;
                }

                ctx.fillText(glyph, x + cellSize / 2, y + cellSize / 2);
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="pointer-events-none absolute inset-0 z-0 h-full w-full rounded-xl opacity-35 dark:opacity-30"
        />
      );
    }

    // Coverflow Carousel Component for Feature Cards & Showcase
    function CoverflowCarousel({ slides, autoplay = true, interval = 3500 }) {
      const [selected, setSelected] = useState(0);
      const [paused, setPaused] = useState(false);
      const count = slides.length;
      if (!count) return null;

      useEffect(() => {
        if (!autoplay || paused || count <= 1) return;
        const timer = setInterval(() => {
          setSelected((prev) => (prev + 1) % count);
        }, interval);
        return () => clearInterval(timer);
      }, [autoplay, paused, count, interval]);

      const next = (e) => { e?.stopPropagation(); setSelected((prev) => (prev + 1) % count); };
      const prev = (e) => { e?.stopPropagation(); setSelected((prev) => (prev - 1 + count) % count); };

      return (
        <div
          className="relative w-full max-w-xl mx-auto my-3 select-none"
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
        >
          {/* 3D Stage */}
          <div className="relative h-48 sm:h-56 w-full overflow-hidden py-2 flex items-center justify-center" style={{ perspective: '800px' }}>
            <div className="relative w-full h-full flex items-center justify-center" style={{ transformStyle: 'preserve-3d' }}>
              {slides.map((slide, idx) => {
                let offset = idx - selected;
                if (offset > count / 2) offset -= count;
                if (offset < -count / 2) offset += count;

                const distance = Math.abs(offset);
                const rotateY = Math.min(44 * Math.pow(distance, 0.56), 82) * Math.sign(offset);
                const translateZ = -120 * distance;
                const translateX = offset * 125;
                const opacity = Math.max(0, 1 - 0.22 * distance);
                const zIndex = 100 - Math.round(distance * 10);

                return (
                  <div
                    key={idx}
                    onClick={() => setSelected(idx)}
                    className="absolute top-1/2 left-1/2 w-36 sm:w-44 aspect-square rounded-2xl overflow-hidden shadow-2xl transition-all duration-1500 ease-in-out cursor-pointer border border-white/30 dark:border-brand-500/60"
                    style={{
                      transform: `translate(-50%, -50%) translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${-rotateY}deg)`,
                      opacity: opacity,
                      zIndex: zIndex,
                      willChange: 'transform, opacity'
                    }}
                  >
                    <img src={slide.src} alt={slide.alt || slide.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent p-2.5 flex flex-col justify-end text-white">
                      <p className="text-xs font-extrabold truncate">{slide.title}</p>
                      {slide.subtitle && <p className="text-[10px] text-brand-300 font-semibold truncate">{slide.subtitle}</p>}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Arrow Navigation */}
            <button
              type="button"
              onClick={prev}
              className="absolute left-1 top-1/2 -translate-y-1/2 z-[200] rounded-full bg-white/90 dark:bg-slate-900/90 p-1.5 text-slate-800 dark:text-white shadow-xl backdrop-blur-md transition hover:scale-110"
              aria-label="Previous slide"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button
              type="button"
              onClick={next}
              className="absolute right-1 top-1/2 -translate-y-1/2 z-[200] rounded-full bg-white/90 dark:bg-slate-900/90 p-1.5 text-slate-800 dark:text-white shadow-xl backdrop-blur-md transition hover:scale-110"
              aria-label="Next slide"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7" /></svg>
            </button>
          </div>

          {/* Caption & Meta */}
          {slides[selected] && (
            <div className="mt-2 text-center">
              <p className="text-xs font-bold text-ink dark:text-white">{slides[selected].title}</p>
              {slides[selected].subtitle && <p className="text-[11px] text-brand-600 dark:text-brand-400 font-medium">{slides[selected].subtitle}</p>}
              {slides[selected].meta && (
                <div className="mt-2 flex flex-wrap justify-center gap-1.5 text-[10px]">
                  {slides[selected].meta.map((m) => (
                    <span key={m.label} className="rounded-full bg-slate-100 dark:bg-slate-800 px-2 py-0.5 font-medium text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                      <strong className="text-ink dark:text-white">{m.label}:</strong> {m.value}
                    </span>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Pagination Dots */}
          <div className="mt-2 flex justify-center gap-1.5">
            {slides.map((_, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => setSelected(idx)}
                className={`h-1.5 rounded-full transition-all ${idx === selected ? 'w-5 bg-brand-600 dark:bg-brand-400' : 'w-1.5 bg-slate-300 dark:bg-slate-700'}`}
              />
            ))}
          </div>
        </div>
      );
    }

                          No active alerts right now. You are all clear.
                        </p>
                      ) : (
                        alerts.map((a) => {
                          const meta = SEVERITY_META[a.severity] || SEVERITY_META.info;
                          return (
                            <div key={a.id} className={`rounded-lg border border-slate-100 border-l-4 bg-slate-50/70 p-3 dark:border-slate-800 dark:bg-slate-900/40 ${meta.bar}`}>
                              <div className="flex items-center justify-between gap-3">
                                <p className="font-bold">{meta.icon} {a.title}</p>
                                <span className={`rounded-full px-2 py-0.5 text-xs font-bold uppercase ${meta.chip}`}>{a.severity}</span>
                              </div>
                              <p className="mt-1 text-sm text-slate-600 dark:text-slate-300">{a.message}</p>
                              <p className="mt-1 text-xs text-slate-400">{formatDate(a.createdAt)}</p>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </section>

                  {/* Register */}
                  <section className="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    {/* 21st.dev Forest ASCII Pixel Art Canvas Background */}
                    <AsciiForestCanvas />
                    <div className="relative z-10">
                      <h2 className="font-dashboard text-xl font-bold tracking-tight">Register Tourist</h2>
                      <form onSubmit={register} autoComplete="off" className="mt-3">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Full Name *
                          <input className={inputCls} required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
                        </label>
                        <div className="mt-3 grid gap-3 sm:grid-cols-2">
                          <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                            Aadhar (optional)
                            <input className={inputCls} maxLength={12} value={form.aadhar} onChange={(e) => setForm({ ...form, aadhar: e.target.value.replace(/\D/g, '') })} />
                          </label>
                          <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                            Phone
                            <input className={inputCls} type="tel" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
                          </label>
                          <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                            Emergency Contact
                            <input className={inputCls} type="tel" value={form.emergencyContact} onChange={(e) => setForm({ ...form, emergencyContact: e.target.value })} />
                          </label>
                          <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                            From (city)
                            <input className={inputCls} value={form.from} onChange={(e) => setForm({ ...form, from: e.target.value })} />
                          </label>
                        </div>
                        <label className="mt-3 block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Destination to visit
                          <input className={inputCls} value={form.to} onChange={(e) => setForm({ ...form, to: e.target.value })} />
                        </label>
                        <label className="mt-3 block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Address / Notes
                          <textarea className={`${inputCls} min-h-[72px]`} rows={2} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} />
                        </label>
                        <div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center">
                          {/* From Uiverse.io by marcelodolza (Pearl Button) */}
                          <button type="submit" className="pearl-btn w-full flex-1">
                            <div className="wrap">
                              <p>Register & Generate ID</p>
                            </div>
                          </button>
                          {/* From Uiverse.io by ke1221 */}
                          <button type="button" onClick={() => downloadJSON('travelshield_db.json', { users, sos, alerts })} className="neu-btn shrink-0">Download DB</button>
                        </div>
                      </form>
                      {regStatus && <p className="mt-2 text-sm font-medium text-brand-600 dark:text-brand-400">{regStatus}</p>}
                      {lastId && (
                        <div className="mt-3 flex items-center gap-2 rounded-lg bg-brand-50 p-3 text-sm dark:bg-slate-800">
                          <span className="font-semibold text-brand-700 dark:text-brand-300">Your Unique ID:</span>
                          <code className="font-mono text-xs">{lastId}</code>
                          <button onClick={async () => { const ok = await copyToClipboard(lastId); setRegStatus(ok ? 'ID copied!' : 'Failed'); }} className="ml-auto rounded bg-white px-2.5 py-1 text-xs font-semibold shadow-sm dark:bg-slate-700">Copy</button>
                        </div>
                      )}
                    </div>
                  </section>

                  {/* Lookup */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-dashboard text-xl font-bold tracking-tight">ID Lookup</h2>
                    <div className="mt-3 flex items-center gap-3">
                      <input className={`${inputCls} mt-0`} placeholder="Enter unique ID" value={lookupId} onChange={(e) => setLookupId(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && doLookup()} />
                      <button onClick={doLookup} className="dot-retro-btn shrink-0">
                        <div><span>Lookup</span></div>
                      </button>
                    </div>
                    {lookupResult === 'none' && <p className="mt-3 text-sm font-medium text-danger">No record found.</p>}
                    {lookupResult && lookupResult !== 'none' && (
                      <dl className="mt-3 grid gap-2 rounded-lg border border-slate-100 bg-slate-50 p-4 text-sm sm:grid-cols-2 dark:border-slate-800 dark:bg-slate-900/50">
                        <div><dt className="text-xs uppercase text-slate-400">Name</dt><dd className="font-semibold">{lookupResult.name}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Phone</dt><dd className="font-semibold">{lookupResult.phone || '—'}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Emergency</dt><dd className="font-semibold">{lookupResult.emergencyContact || '—'}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Destination</dt><dd className="font-semibold">{lookupResult.to || '—'}</dd></div>
                      </dl>
                    )}
                  </section>

                  {/* Helplines */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-dashboard text-xl font-bold tracking-tight">🚨 Quick Helplines</h2>
                    <div className="mt-3 space-y-3">
                      {HELPLINES.map((h) => (
                        <div key={h.number} className="flex items-center justify-between rounded-lg border border-slate-100 p-3 dark:border-slate-800">
                          <div>
                            <p className="font-bold">{h.label}</p>
                            <p className="text-xs text-slate-500 dark:text-slate-400">{h.sub}</p>
                          </div>
                          <a href={`tel:${h.number}`} className={`dot-retro-btn ${h.tone === 'danger' ? 'dot-retro-btn-danger' : ''}`}>
                            <div><span>Call {h.number}</span></div>
                          </a>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* Registered Tourists */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">Registered Tourists (Local Browser Data)</h2>
                    <div className="mt-3 space-y-2">
                      {users.length === 0 ? (
                        <p className="text-sm text-slate-500">No users registered yet.</p>
                      ) : (
                        users.map((u) => (
                          <div key={u.id} className="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-slate-100 p-3 dark:border-slate-800">
                            <div>
                              <p className="font-bold">{u.name} <span className="font-mono text-xs font-normal text-slate-400">({u.id.slice(0, 8)})</span></p>
                              <p className="text-xs text-slate-500">Dest: {u.to || '—'} &bull; Reg: {formatDate(u.createdAt)}</p>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => triggerSos(u)} className="rounded bg-danger px-3 py-1.5 text-xs font-bold text-white shadow-sm">SOS</button>
                              <button onClick={() => removeUser(u.id)} className="rounded bg-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:bg-slate-700 dark:text-slate-200">Delete</button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </section>
                </main>
              ) : (
                /* Admin Tab */
                <aside className="mt-6 space-y-6">
                  {!adminAuthed ? (
                    <div className="relative overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg dark:border-slate-800 dark:bg-[#0b1f2e]">
                      {/* 21st.dev Forest ASCII Pixel Art Canvas Background */}
                      <AsciiForestCanvas />
                      <form className="relative z-10 w-full p-6" onSubmit={(e) => { e.preventDefault(); loginAdmin(); }}>
                        <div className="text-center">
                          <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-600/10 text-2xl font-bold text-brand-600 dark:bg-brand-500/20 dark:text-brand-400">
                            🔐
                          </div>
                          <h2 className="mt-3 font-dashboard text-2xl font-extrabold text-ink dark:text-white">Admin Login</h2>
                          <p className="mt-1 text-xs font-semibold text-slate-500 dark:text-slate-400">Log in to dashboard</p>
                        </div>
                        <div className="mt-6 space-y-4">
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Username</label>
                            <input
                              className="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm font-semibold text-ink outline-none transition focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/10 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-100 dark:focus:border-brand-400 dark:focus:bg-slate-900"
                              type="text"
                              defaultValue="admin"
                              readOnly
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
                            <input
                              className="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm font-semibold text-ink outline-none transition focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/10 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-100 dark:focus:border-brand-400 dark:focus:bg-slate-900"
                              type="password"
                              placeholder="Enter admin password"
                              value={adminPass}
                              onChange={(e) => setAdminPass(e.target.value)}
                              required
                            />
                          </div>
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-slate-400">Default pass: <strong className="cursor-pointer text-brand-600 dark:text-brand-400" onClick={() => setAdminPass('admin123')}>admin123</strong></span>
                            <button type="button" onClick={() => setAdminStatus('Default password is: admin123')} className="font-bold text-brand-600 hover:underline dark:text-brand-400">Forgot?</button>
                          </div>
                          <button type="submit" className="pearl-btn w-full mt-2">
                            <div className="wrap">
                              <p>Log In</p>
                            </div>
                          </button>
                          {adminStatus && <p className="text-center text-xs font-bold text-danger">{adminStatus}</p>}
                        </div>
                      </form>
                    </div>
                  ) : (
                    <>
                      <section className="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        {/* 21st.dev Forest ASCII Pixel Art Canvas Background */}
                        <AsciiForestCanvas />
                        <div className="relative z-10">
                          <div className="flex items-center justify-between">
                            <h2 className="font-dashboard text-xl font-bold tracking-tight">Admin Overview</h2>
                            <button onClick={() => setAdminAuthed(false)} className="rounded bg-danger px-3 py-1 text-sm font-bold text-white">Logout</button>
                          </div>
                          <div className="mt-4 grid gap-3 sm:grid-cols-3">
                            <div className="rounded-lg border border-slate-100 bg-slate-50/80 p-4 dark:border-slate-800 dark:bg-slate-900/70">
                              <p className="font-dashboard text-2xl font-extrabold text-brand-600">{users.length}</p>
                              <p className="text-xs uppercase text-slate-400">Registered</p>
                            </div>
                            <div className="rounded-lg border border-slate-100 bg-slate-50/80 p-4 dark:border-slate-800 dark:bg-slate-900/70">
                              <p className="font-dashboard text-2xl font-extrabold text-danger">{sos.length}</p>
                              <p className="text-xs uppercase text-slate-400">SOS Logs</p>
                            </div>
                            <div className="rounded-lg border border-slate-100 bg-slate-50/80 p-4 dark:border-slate-800 dark:bg-slate-900/70">
                              <p className="font-dashboard text-2xl font-extrabold text-warn">{alerts.length}</p>
                              <p className="text-xs uppercase text-slate-400">Active Alerts</p>
                            </div>
                          </div>
                          <div className="mt-4 flex flex-col gap-2 sm:flex-row">
                            <input className={`${inputCls} mt-0 flex-1`} placeholder="Search users" value={query} onChange={(e) => setQuery(e.target.value)} />
                            <button onClick={() => downloadJSON('users.json', users)} className="rounded bg-slate-100 px-3 py-2 text-xs font-semibold dark:bg-slate-800">Export Users</button>
                            <button onClick={() => downloadJSON('sos_logs.json', sos)} className="rounded bg-slate-100 px-3 py-2 text-xs font-semibold dark:bg-slate-800">Export SOS</button>
                          </div>
                        </div>
                      </section>

                      <section className="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        {/* 21st.dev Forest ASCII Pixel Art Canvas Background */}
                        <AsciiForestCanvas />
                        <div className="relative z-10">
                          <h3 className="font-dashboard text-lg font-bold tracking-tight">Broadcast Alert</h3>
                          <form onSubmit={broadcastAlert} className="mt-3 space-y-3">
                            <div className="flex gap-2">
                              <input className={`${inputCls} mt-0 flex-1`} placeholder="Alert Title" value={alertDraft.title} onChange={(e) => setAlertDraft({ ...alertDraft, title: e.target.value })} />
                              <select className={`${inputCls} mt-0 w-32`} value={alertDraft.severity} onChange={(e) => setAlertDraft({ ...alertDraft, severity: e.target.value })}>
                                <option value="info">Info</option>
                                <option value="warning">Warning</option>
                                <option value="danger">Danger</option>
                              </select>
                            </div>
                            <textarea className={`${inputCls} min-h-[60px]`} placeholder="Alert details..." value={alertDraft.message} onChange={(e) => setAlertDraft({ ...alertDraft, message: e.target.value })} />
                            <button type="submit" className="w-full rounded-lg bg-brand-600 py-2.5 font-semibold text-white hover:bg-brand-700">Broadcast Alert</button>
                          </form>
                          {alertStatus && <p className="mt-2 text-sm font-medium text-brand-600">{alertStatus}</p>}
                        </div>
                      </section>

                      <section className="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        {/* 21st.dev Forest ASCII Pixel Art Canvas Background */}
                        <AsciiForestCanvas />
                        <div className="relative z-10">
                          <h3 className="font-dashboard text-lg font-bold tracking-tight">Security</h3>
                          <div className="mt-3 flex gap-2">
                            <input className={`${inputCls} mt-0`} type="password" placeholder="New admin password" value={newPass} onChange={(e) => setNewPass(e.target.value)} />
                            <button onClick={changePass} className="rounded-lg bg-brand-600 px-4 font-semibold text-white">Update</button>
                          </div>
                          {securityStatus && <p className="mt-2 text-sm font-medium text-brand-600">{securityStatus}</p>}
                        </div>
                      </section>
                    </>
                  )}
                </aside>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
