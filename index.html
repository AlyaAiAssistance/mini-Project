  <style>
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.9; }
    }
    .sos-pulse {
      animation: pulseSoft 2s infinite ease-in-out;
    }
    .dot-grid {
      background-image: radial-gradient(rgba(7, 101, 214, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .dark .dot-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    }
    /* Loader Styles from Uiverse.io by SelfMadeSystem */ 
    .absolute {
      position: absolute;
    }
    .inline-block {
      display: inline-block;
    }
    .loader {
      display: flex;
      margin: 0.25em 0;
    }
    .w-2 {
      width: 0.5em;
    }
    .dash {
      animation: dashArray 2s ease-in-out infinite,
        dashOffset 2s linear infinite;
    }
    .spin {
      animation: spinDashArray 2s ease-in-out infinite,
        spin 8s ease-in-out infinite,
        dashOffset 2s linear infinite;
      transform-origin: center;
    }
    @keyframes dashArray {
      0% {
        stroke-dasharray: 0 1 359 0;
      }
      50% {
        stroke-dasharray: 0 359 1 0;
      }
      100% {
        stroke-dasharray: 359 1 0 0;
      }
    }
    @keyframes spinDashArray {
      0% {
        stroke-dasharray: 270 90;
      }
      50% {
        stroke-dasharray: 0 360;
      }
      100% {
        stroke-dasharray: 270 90;
      }
    }
    @keyframes dashOffset {
      0% {
        stroke-dashoffset: 365;
      }
      100% {
        stroke-dashoffset: 5;
      }
    }
    @keyframes spin {
      0% {
        rotate: 0deg;
      }
      12.5%,
      25% {
        rotate: 270deg;
      }
      37.5%,
      50% {
        rotate: 540deg;
      }
      62.5%,
      75% {
        rotate: 810deg;
      }
      87.5%,
      100% {
        rotate: 1080deg;
      }
    }

    /* Preloader Overlay Styles */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .preloader-title {
      color: #f8fafc;
      font-family: 'Sora', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00E0ED, #973BED, #FFC800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 2s ease-in-out infinite;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
    .letter-svg {
      width: 32px;
      height: 32px;
      fill: none;
    }
    @media (min-width: 640px) {
      .letter-svg {
        width: 52px;
        height: 52px;
      }
    }
    @media (min-width: 1024px) {
      .letter-svg {
        width: 64px;
        height: 64px;
      }
    }
    /* From Uiverse.io by catraco */ 
    .btn-class-name {
      --primary: 255, 65, 84;
      --secondary: 150, 30, 45;
      width: 130px;
      height: 130px;
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      outline: 10px solid rgba(var(--primary), .4);
      border-radius: 100%;
      position: relative;
      transition: .3s;
    }

    .btn-class-name .back {
      background: rgb(var(--secondary));
      border-radius: 100%;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .btn-class-name .front {
      background: linear-gradient(0deg, rgba(var(--primary), .7) 20%, rgba(var(--primary)) 50%);
      box-shadow: 0 .5em 1em -0.2em rgba(var(--secondary), .5);
      border-radius: 100%;
      position: absolute;
      border: 2px solid rgb(var(--secondary));
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 800;
      font-family: inherit;
      transform: translateY(-15%);
      transition: .15s;
      color: #ffffff;
    }

    .btn-class-name:active .front {
      transform: translateY(0%);
      box-shadow: 0 0;
    }

    /* From Uiverse.io by marcelodolza (Pearl Button - Brand Blue Edition) */ 
    .pearl-btn {
      --white: #ffffff;
      --bg: #0765d6;
      --radius: 100px;
      outline: none;
      cursor: pointer;
      border: 0;
      position: relative;
      border-radius: var(--radius);
      background-color: var(--bg);
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
      box-shadow:
        inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.45),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.6),
        0 1rem 2rem -0.4rem rgba(7, 101, 214, 0.4);
    }
    .pearl-btn .wrap {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      padding: 13px 32px;
      border-radius: inherit;
      position: relative;
      overflow: hidden;
    }
    .pearl-btn-sm .wrap {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      padding: 9px 22px;
    }
    .pearl-btn .wrap p span:nth-child(2) {
      display: none;
    }
    .pearl-btn:hover .wrap p span:nth-child(1) {
      display: none;
    }
    .pearl-btn:hover .wrap p span:nth-child(2) {
      display: inline-block;
    }
    .pearl-btn .wrap p {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0;
      transition: all 0.2s ease;
      transform: translateY(2%);
    }
    .pearl-btn .wrap::before,
    .pearl-btn .wrap::after {
      content: "";
      position: absolute;
      transition: all 0.3s ease;
    }
    .pearl-btn .wrap::before {
      left: -15%;
      right: -15%;
      bottom: 25%;
      top: -100%;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.22);
    }
    .pearl-btn .wrap::after {
      left: 6%;
      right: 6%;
      top: 12%;
      bottom: 40%;
      border-radius: 22px 22px 0 0;
      box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.9);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(0, 0, 0, 0) 50%,
        rgba(0, 0, 0, 0) 100%
      );
    }
    .pearl-btn:hover {
      box-shadow:
        inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.65),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.8),
        0 1.4rem 2.4rem -0.4rem rgba(7, 101, 214, 0.5);
    }
    .pearl-btn:hover .wrap::before {
      transform: translateY(-5%);
    }
    .pearl-btn:hover .wrap::after {
      opacity: 0.6;
      transform: translateY(5%);
    }
    .pearl-btn:hover .wrap p {
      transform: translateY(-4%);
    }
    .pearl-btn:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.6),
        inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.6),
        inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.5),
        0 0.8rem 1.5rem -0.4rem rgba(7, 101, 214, 0.4);
    }

    /* From Uiverse.io by Galahhad - BB8 Star Wars Theme Toggle */ 
    .bb8-toggle {
      --toggle-size: 6px;
      --toggle-width: 10.625em;
      --toggle-height: 5.625em;
      --toggle-offset: calc((var(--toggle-height) - var(--bb8-diameter)) / 2);
      --toggle-bg: linear-gradient(#2c4770, #070e2b 35%, #628cac 50% 70%, #a6c5d4) no-repeat;
      --bb8-diameter: 4.375em;
      --radius: 99em;
      --transition: 0.4s;
      --accent: #de7d2f;
      --bb8-bg: #fff;
      display: inline-block;
      cursor: pointer;
      font-size: var(--toggle-size);
      user-select: none;
      vertical-align: middle;
    }

    .bb8-toggle,
    .bb8-toggle *,
    .bb8-toggle *::before,
    .bb8-toggle *::after {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    .bb8-toggle__checkbox {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      display: none;
    }

    .bb8-toggle__container {
      width: var(--toggle-width);
      height: var(--toggle-height);
      background: var(--toggle-bg);
      background-size: 100% 11.25em;
      background-position-y: -5.625em;
      border-radius: var(--radius);
      position: relative;
      -webkit-transition: var(--transition);
      -o-transition: var(--transition);

    .bb8 {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      position: absolute;
      top: calc(var(--toggle-offset) - 1.688em + 0.188em);
      left: var(--toggle-offset);
      -webkit-transition: var(--transition);
      -o-transition: var(--transition);
      transition: var(--transition);
      z-index: 2;
    }

    .bb8__head-container {
      position: relative;
      -webkit-transition: var(--transition);
      -o-transition: var(--transition);
      transition: var(--transition);
      z-index: 2;
      -webkit-transform-origin: 1.25em 3.75em;
      -ms-transform-origin: 1.25em 3.75em;
      transform-origin: 1.25em 3.75em;
    }

    .bb8__head {
      overflow: hidden;
      margin-bottom: -0.188em;
      width: 2.5em;
      height: 1.688em;
      background: linear-gradient(
          transparent 0.063em,
          dimgray 0.063em 0.313em,
          transparent 0.313em 0.375em,
          var(--accent) 0.375em 0.5em,
          transparent 0.5em 1.313em,
          silver 1.313em 1.438em,
          transparent 1.438em
        ),
        linear-gradient(
          45deg,
          transparent 0.188em,
          var(--bb8-bg) 0.188em 1.25em,
          transparent 1.25em
        ),
        linear-gradient(
          -45deg,
          transparent 0.188em,
          var(--bb8-bg) 0.188em 1.25em,
          transparent 1.25em
        ),
        linear-gradient(var(--bb8-bg) 1.25em, transparent 1.25em);
      border-radius: var(--radius) var(--radius) 0 0;
      position: relative;
      z-index: 1;
      -webkit-filter: drop-shadow(0 0.063em 0.125em gray);
      filter: drop-shadow(0 0.063em 0.125em gray);
    }

    .bb8__head::before {
      content: "";
      position: absolute;
      width: 0.563em;
      height: 0.563em;
      background: radial-gradient(
          0.125em circle at 0.25em 0.375em,
          red,
          transparent
        ),
        radial-gradient(
          0.063em circle at 0.375em 0.188em,
          var(--bb8-bg) 50%,
          transparent 100%
        ),
        linear-gradient(45deg, #000 0.188em, dimgray 0.313em 0.375em, #000 0.5em);
      border-radius: var(--radius);
      top: 0.413em;
      left: 50%;
      -webkit-transform: translate(-50%);
      -ms-transform: translate(-50%);
      transform: translate(-50%);
      -webkit-box-shadow: 0 0 0 0.089em lightgray, 0.563em 0.281em 0 -0.148em,
        0.563em 0.281em 0 -0.1em var(--bb8-bg), 0.563em 0.281em 0 -0.063em;
      box-shadow: 0 0 0 0.089em lightgray, 0.563em 0.281em 0 -0.148em,

      z-index: 1;
      -webkit-transition: var(--transition);
      -o-transition: var(--transition);

      bottom: 0.375em;

      height: 0.188em;
      background: linear-gradient(

        var(--accent) 2.438em
      );
      -webkit-transition: var(--transition);
      -o-transition: var(--transition);
      transition: var(--transition);

    .bb8__antenna {
      position: absolute;
      -webkit-transform: translateY(-90%);
      -ms-transform: translateY(-90%);
      transform: translateY(-90%);

      right: 0.938em;
      background: linear-gradient(#000 0.188em, silver 0.188em);

    .bb8__antenna:nth-child(2) {

      left: 50%;
      -webkit-transform: translate(-50%, -90%);
      -ms-transform: translate(-50%, -90%);
      transform: translate(-50%, -90%);

    }

    .bb8__body {
      width: 4.375em;
      height: 4.375em;
      background: var(--bb8-bg);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      -webkit-transition: var(--transition);

      position: absolute;
      width: 0.188em;
      height: 0.188em;
      background: rgb(236, 236, 236);

      border-radius: 50%;
      z-index: 0.1;
      overflow: hidden;
      top: 50%;
      left: 50%;

        ),

        linear-gradient(

        ),

            preloader.classList.add('fade-out');

            }, 600);
          }, 2200);
        }
      }
      if (document.readyState === 'complete') {

      } else {

    // Helper functions
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString();
      } catch {
        return iso;
      }
    }

    function downloadJSON(filename, obj) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    async function sha256(message) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(message));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function ensureAdmin() {
      if (!localStorage.getItem(ADMIN_HASH_KEY)) {
        localStorage.setItem(ADMIN_HASH_KEY, await sha256('admin123'));
      }
    }

    async function copyToClipboard(text) {
      if (!text) return false;
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch {
        document.body.removeChild(ta);
        return false;
      }
    }

    function getPosition(timeout = 6000) {
      return new Promise((resolve) => {
        if (!('geolocation' in navigator)) return resolve('unavailable');
        const timer = setTimeout(() => resolve('unavailable'), timeout + 500);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(timer);
            resolve(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`);
          },
          () => {
            clearTimeout(timer);
            resolve('permission denied');
          },
          { timeout, maximumAge: 60000 }
        );
      });
    }

    // SOS Demo Component
    function SosDemo() {
      const [progress, setProgress] = useState(0);
      const [sent, setSent] = useState(false);
      const raf = useRef(null);
      const start = useRef(0);

      const stop = () => {
        if (raf.current) cancelAnimationFrame(raf.current);
        raf.current = null;
        if (!sent) setProgress(0);
      };

      const begin = () => {
        if (sent) {
          setSent(false);
          setProgress(0);
        }
        start.current = performance.now();
        const tick = (t) => {
          const p = Math.min(1, (t - start.current) / 3000);
          setProgress(p);
          if (p >= 1) {
            setSent(true);
            raf.current = null;
            return;
          }
          raf.current = requestAnimationFrame(tick);
        };
        raf.current = requestAnimationFrame(tick);
      };

      useEffect(() => () => stop(), []);

      return (
        <div className="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl shadow-slate-200/60 dark:border-slate-800 dark:bg-[#0b1f2e] dark:shadow-none">

          <p className="mx-auto mt-2 max-w-xs text-sm text-slate-500 dark:text-slate-400">
            In an emergency, press and hold the button below for 3 seconds.
          </p>

          <div className="my-8 flex justify-center">
            {/* From Uiverse.io by catraco */}
            <button
              onMouseDown={begin}
              onMouseUp={stop}
              onMouseLeave={stop}
              onTouchStart={(e) => { e.preventDefault(); begin(); }}
              onTouchEnd={stop}
              className="btn-class-name"
              aria-label="Hold to trigger demo SOS"
            >
              <span className="back"></span>
              <span className="front">
                <svg className="absolute inset-0 -rotate-90 pointer-events-none p-1" viewBox="0 0 100 100">
                  <circle
                    cx="50"
                    cy="50"
                    r="44"
                    fill="none"
                    stroke="rgba(255,255,255,0.85)"
                    strokeWidth="6"
                    strokeDasharray={`${progress * 276} 276`}
                    strokeLinecap="round"
                  />
                </svg>
                <span className="font-display font-black tracking-wider">
                  {sent ? '✓' : 'SoS'}
                </span>
              </span>
            </button>
          </div>

          <p className="h-5 text-sm font-semibold text-slate-500 dark:text-slate-400">
            {sent
              ? 'Demo alert sent to your contacts.'
              : progress > 0
                ? `Hold… ${(3 - progress * 3).toFixed(1)}s`
                : 'Press and hold to test'}
          </p>
        </div>
      );
    }

                        <p className="mt-3 leading-relaxed text-slate-600 dark:text-slate-300">{f.body}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* How it works */}
              <section id="how-it-works" className="bg-slate-50 py-24 dark:bg-[#071424]">
                <div className="mx-auto grid max-w-6xl items-center gap-16 px-6 lg:grid-cols-2">
                  <div>
                    <h2 className="font-semibold uppercase tracking-widest text-brand-600 dark:text-brand-400">How It Works</h2>
                    <h3 className="mt-3 font-display text-3xl font-extrabold text-ink sm:text-4xl dark:text-white">
                      Your Safety in 3 Simple Steps
                    </h3>
                    <ul className="mt-10 space-y-8">
                      {[
                        { strong: 'Set Up Your Profile.', body: 'Add your trip details and emergency contacts so we can provide personalized alerts.' },
                        { strong: 'Explore with Peace of Mind.', body: 'Keep the app running in the background to receive alerts and access safety features.' },
                        { strong: 'Get Help When Needed.', body: 'Use the SOS button to instantly connect with help if you are in an unsafe situation.' }
                      ].map((s, i) => (
                        <li key={s.strong} className="flex gap-5">
                          <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-600 font-display text-lg font-bold text-white shadow-lg">
                            {i + 1}
                          </div>
                          <p className="pt-1.5 text-slate-600 dark:text-slate-300">
                            <strong className="text-ink dark:text-white">{s.strong}</strong> {s.body}
                          </p>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <SosDemo />
                  </div>
                </div>
              </section>

              {/* Testimonials */}
              <section id="testimonials" className="bg-white py-24 dark:bg-[#0b1f2e]">
                <div className="mx-auto max-w-6xl px-6">
                  <div className="text-center">
                    <h2 className="font-semibold uppercase tracking-widest text-brand-600 dark:text-brand-400">Testimonials</h2>
                    <h3 className="mt-3 font-display text-3xl font-extrabold text-ink sm:text-4xl dark:text-white">
                      Trusted by Travelers Worldwide
                    </h3>
                  </div>
                  <div className="mt-14 grid gap-8 md:grid-cols-3">
                    {[
                      { quote: 'This app was a lifesaver during my solo trip through Southeast Asia. The local alerts gave me so much peace of mind!', name: 'Anjali Sharma', role: 'Solo Traveler', initials: 'AS' },
                      { quote: 'The emergency contact feature is brilliant. My family felt much more at ease knowing they could be alerted if something went wrong.', name: 'Rohan Mehta', role: 'Family Vacationer', initials: 'RM' },
                      { quote: 'Navigating a new city was so much easier with the safe zone maps. I discovered amazing local spots I would have otherwise missed.', name: 'Priya Verma', role: 'Backpacker', initials: 'PV' }
                    ].map((t) => (
                      <figure key={t.name} className="flex flex-col justify-between rounded-2xl border border-slate-100 bg-slate-50/70 p-8 dark:border-slate-800 dark:bg-slate-900/50">
                        <blockquote className="leading-relaxed text-slate-700 dark:text-slate-300">“{t.quote}”</blockquote>
                        <figcaption className="mt-6 flex items-center gap-4">
                          <div className="flex h-12 w-12 items-center justify-center rounded-full bg-brand-600 font-bold text-white">
                            {t.initials}
                          </div>
                          <div>
                            <p className="font-bold text-ink dark:text-white">{t.name}</p>
                            <p className="text-sm text-slate-500 dark:text-slate-400">{t.role}</p>
                          </div>
                        </figcaption>
                      </figure>
                    ))}
                  </div>
                </div>
              </section>

              {/* Footer */}
              <footer className="bg-ink py-14 text-slate-300 dark:bg-[#030b14]">
                <div className="mx-auto max-w-6xl px-6 text-center sm:text-left">
                  <div className="grid gap-10 sm:grid-cols-3">
                    <div>
                      <h4 className="font-display text-xl font-bold text-white">🛡️ TravelShield</h4>
                      <p className="mt-3 text-sm text-slate-400">Your safety, our priority.</p>
                    </div>
                    <div>
                      <h4 className="font-semibold text-white">Quick Links</h4>
                      <ul className="mt-3 space-y-2 text-sm">
                        <li><button onClick={() => setView('landing')} className="hover:text-white">Home</button></li>
                        <li><button onClick={() => { setView('dashboard'); setTab('user'); }} className="hover:text-white">Dashboard</button></li>
                      </ul>
                    </div>
                    <div>
                      <h4 className="font-semibold text-white">Legal</h4>
                      <p className="mt-3 text-sm text-slate-400">Privacy Policy &bull; Terms of Service</p>
                    </div>
                  </div>
                  <div className="mt-10 border-t border-white/10 pt-6 text-center text-sm text-slate-400">
                    © {new Date().getFullYear()} TravelShield. All Rights Reserved.
                  </div>
                </div>
              </footer>
            </main>
          ) : (
            /* Dashboard View */
            <div className="mx-auto max-w-5xl px-5 pt-28 pb-12">
              <header className="relative border-b border-slate-200 pb-4 text-center dark:border-slate-800">
                <h1 className="font-display text-3xl font-extrabold text-brand-600 dark:text-brand-400">TravelShield Dashboard</h1>
                <p className="mt-1 text-sm text-slate-500 dark:text-slate-400">Smart Tourist Safety Monitoring System</p>

                <nav className="mt-5 flex flex-wrap items-center justify-center gap-3">
                  <button
                    onClick={() => setView('landing')}
                    className="neu-btn"
                  >
                    ← Back to Home
                  </button>
                  {['user', 'admin'].map((t) => (
                    tab === t ? (
                      /* From Uiverse.io by satyamchaudharydev */
                      <button
                        key={t}
                        onClick={() => setTab(t)}
                        className="wave-btn"
                      >
                        <p>{t === 'user' ? 'User Dashboard' : 'Admin Dashboard'}</p>
                      </button>
                    ) : (
                      /* From Uiverse.io by ke1221 */
                      <button
                        key={t}
                        onClick={() => setTab(t)}
                        className="neu-btn"
                      >
                        {t === 'user' ? 'User Dashboard' : 'Admin Dashboard'}
                      </button>
                    )
                  ))}
                </nav>
              </header>

              {tab === 'user' ? (
                <main className="mt-6 space-y-6">
                  {/* Alerts */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">📢 Local Safety Alerts</h2>
                    <div className="mt-3 space-y-2">
                      {alerts.length === 0 ? (
                        <p className="rounded-lg border border-dashed border-slate-200 p-4 text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">
                          No active alerts right now. You are all clear.
                        </p>
                      ) : (
                        alerts.map((a) => {
                          const meta = SEVERITY_META[a.severity] || SEVERITY_META.info;
                          return (
                            <div key={a.id} className={`rounded-lg border border-slate-100 border-l-4 bg-slate-50/70 p-3 dark:border-slate-800 dark:bg-slate-900/40 ${meta.bar}`}>
                              <div className="flex items-center justify-between gap-3">
                                <p className="font-bold">{meta.icon} {a.title}</p>
                                <span className={`rounded-full px-2 py-0.5 text-xs font-bold uppercase ${meta.chip}`}>{a.severity}</span>
                              </div>
                              <p className="mt-1 text-sm text-slate-600 dark:text-slate-300">{a.message}</p>
                              <p className="mt-1 text-xs text-slate-400">{formatDate(a.createdAt)}</p>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </section>

                  {/* Register */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">Register Tourist</h2>
                    <form onSubmit={register} autoComplete="off" className="mt-3">
                      <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                        Full Name *
                        <input className={inputCls} required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
                      </label>
                      <div className="mt-3 grid gap-3 sm:grid-cols-2">
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Aadhar (optional)
                          <input className={inputCls} maxLength={12} value={form.aadhar} onChange={(e) => setForm({ ...form, aadhar: e.target.value.replace(/\D/g, '') })} />
                        </label>
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Phone
                          <input className={inputCls} type="tel" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
                        </label>
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                          Emergency Contact
                          <input className={inputCls} type="tel" value={form.emergencyContact} onChange={(e) => setForm({ ...form, emergencyContact: e.target.value })} />
                        </label>
                        <label className="block text-sm font-medium text-slate-600 dark:text-slate-300">
                          From (city)
                          <input className={inputCls} value={form.from} onChange={(e) => setForm({ ...form, from: e.target.value })} />
                        </label>
                      </div>
                      <label className="mt-3 block text-sm font-medium text-slate-600 dark:text-slate-300">
                        Destination to visit
                        <input className={inputCls} value={form.to} onChange={(e) => setForm({ ...form, to: e.target.value })} />
                      </label>
                      <label className="mt-3 block text-sm font-medium text-slate-600 dark:text-slate-300">
                        Address / Notes
                        <textarea className={`${inputCls} min-h-[72px]`} rows={2} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} />
                      </label>
                      <div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center">
                        {/* From Uiverse.io by satyamchaudharydev */}
                        <button type="submit" className="wave-btn w-full flex-1">
                          <p>Register & Generate ID</p>
                        </button>
                        {/* From Uiverse.io by ke1221 */}
                        <button type="button" onClick={() => downloadJSON('travelshield_db.json', { users, sos, alerts })} className="neu-btn shrink-0">Download DB</button>
                      </div>
                    </form>
                    {regStatus && <p className="mt-2 text-sm font-medium text-brand-600 dark:text-brand-400">{regStatus}</p>}
                    {lastId && (
                      <div className="mt-3 flex items-center gap-2 rounded-lg bg-brand-50 p-3 text-sm dark:bg-slate-800">
                        <span className="font-semibold text-brand-700 dark:text-brand-300">Your Unique ID:</span>
                        <code className="font-mono text-xs">{lastId}</code>
                        <button onClick={async () => { const ok = await copyToClipboard(lastId); setRegStatus(ok ? 'ID copied!' : 'Failed'); }} className="ml-auto rounded bg-white px-2.5 py-1 text-xs font-semibold shadow-sm dark:bg-slate-700">Copy</button>
                      </div>
                    )}
                  </section>

                  {/* Lookup */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">ID Lookup</h2>
                    <div className="mt-3 flex items-center gap-3">
                      <input className={`${inputCls} mt-0`} placeholder="Enter unique ID" value={lookupId} onChange={(e) => setLookupId(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && doLookup()} />
                      <button onClick={doLookup} className="dot-retro-btn shrink-0">
                        <div><span>Lookup</span></div>
                      </button>
                    </div>
                    {lookupResult === 'none' && <p className="mt-3 text-sm font-medium text-danger">No record found.</p>}
                    {lookupResult && lookupResult !== 'none' && (
                      <dl className="mt-3 grid gap-2 rounded-lg border border-slate-100 bg-slate-50 p-4 text-sm sm:grid-cols-2 dark:border-slate-800 dark:bg-slate-900/50">
                        <div><dt className="text-xs uppercase text-slate-400">Name</dt><dd className="font-semibold">{lookupResult.name}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Phone</dt><dd className="font-semibold">{lookupResult.phone || '—'}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Emergency</dt><dd className="font-semibold">{lookupResult.emergencyContact || '—'}</dd></div>
                        <div><dt className="text-xs uppercase text-slate-400">Destination</dt><dd className="font-semibold">{lookupResult.to || '—'}</dd></div>
                      </dl>
                    )}
                  </section>

                  {/* Helplines */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">🚨 Quick Helplines</h2>
                    <div className="mt-3 space-y-3">
                      {HELPLINES.map((h) => (
                        <div key={h.number} className="flex items-center justify-between rounded-lg border border-slate-100 p-3 dark:border-slate-800">
                          <div>
                            <p className="font-bold">{h.label}</p>
                            <p className="text-xs text-slate-500 dark:text-slate-400">{h.sub}</p>
                          </div>
                          <a href={`tel:${h.number}`} className={`dot-retro-btn ${h.tone === 'danger' ? 'dot-retro-btn-danger' : ''}`}>
                            <div><span>Call {h.number}</span></div>
                          </a>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* Registered Tourists */}
                  <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                    <h2 className="font-display text-lg font-bold">Registered Tourists (Local Browser Data)</h2>
                    <div className="mt-3 space-y-2">
                      {users.length === 0 ? (
                        <p className="text-sm text-slate-500">No users registered yet.</p>
                      ) : (
                        users.map((u) => (
                          <div key={u.id} className="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-slate-100 p-3 dark:border-slate-800">
                            <div>
                              <p className="font-bold">{u.name} <span className="font-mono text-xs font-normal text-slate-400">({u.id.slice(0, 8)})</span></p>
                              <p className="text-xs text-slate-500">Dest: {u.to || '—'} &bull; Reg: {formatDate(u.createdAt)}</p>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => triggerSos(u)} className="rounded bg-danger px-3 py-1.5 text-xs font-bold text-white shadow-sm">SOS</button>
                              <button onClick={() => removeUser(u.id)} className="rounded bg-slate-200 px-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:bg-slate-700 dark:text-slate-200">Delete</button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </section>
                </main>
              ) : (
                /* Admin Tab */
                <aside className="mt-6 space-y-6">
                  {!adminAuthed ? (
                    <div className="rounded-2xl border border-slate-200 bg-white shadow-lg dark:border-slate-800 dark:bg-[#0b1f2e]">
                      <form className="w-full p-6" onSubmit={(e) => { e.preventDefault(); loginAdmin(); }}>
                        <div className="text-center">
                          <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-600/10 text-2xl font-bold text-brand-600 dark:bg-brand-500/20 dark:text-brand-400">
                            🔐
                          </div>
                          <h2 className="mt-3 font-display text-xl font-extrabold text-ink dark:text-white">Admin Login</h2>
                          <p className="mt-1 text-xs font-semibold text-slate-500 dark:text-slate-400">Log in to dashboard</p>
                        </div>
                        <div className="mt-6 space-y-4">
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Username</label>
                            <input
                              className="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm font-semibold text-ink outline-none transition focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/10 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-100 dark:focus:border-brand-400 dark:focus:bg-slate-900"
                              type="text"
                              defaultValue="admin"
                              readOnly
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
                            <input
                              className="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm font-semibold text-ink outline-none transition focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/10 dark:border-slate-700 dark:bg-slate-900/60 dark:text-slate-100 dark:focus:border-brand-400 dark:focus:bg-slate-900"
                              type="password"
                              placeholder="Enter admin password"
                              value={adminPass}
                              onChange={(e) => setAdminPass(e.target.value)}
                              required
                            />
                          </div>
                          <div className="flex items-center justify-between text-xs">
                            <span className="text-slate-400">Default pass: <strong className="cursor-pointer text-brand-600 dark:text-brand-400" onClick={() => setAdminPass('admin123')}>admin123</strong></span>
                            <button type="button" onClick={() => setAdminStatus('Default password is: admin123')} className="font-bold text-brand-600 hover:underline dark:text-brand-400">Forgot?</button>
                          </div>
                          <button type="submit" className="wave-btn w-full mt-2">
                            <p>Log In</p>
                          </button>
                          {adminStatus && <p className="text-center text-xs font-bold text-danger">{adminStatus}</p>}
                        </div>
                      </form>
                    </div>
                  ) : (
                    <>
                      <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        <div className="flex items-center justify-between">
                          <h2 className="font-display text-lg font-bold">Admin Overview</h2>
                          <button onClick={() => setAdminAuthed(false)} className="rounded bg-danger px-3 py-1 text-sm font-bold text-white">Logout</button>
                        </div>
                        <div className="mt-4 grid gap-3 sm:grid-cols-3">
                          <div className="rounded-lg border border-slate-100 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900/50">
                            <p className="font-display text-2xl font-extrabold text-brand-600">{users.length}</p>
                            <p className="text-xs uppercase text-slate-400">Registered</p>
                          </div>
                          <div className="rounded-lg border border-slate-100 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900/50">
                            <p className="font-display text-2xl font-extrabold text-danger">{sos.length}</p>
                            <p className="text-xs uppercase text-slate-400">SOS Logs</p>
                          </div>
                          <div className="rounded-lg border border-slate-100 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900/50">
                            <p className="font-display text-2xl font-extrabold text-warn">{alerts.length}</p>
                            <p className="text-xs uppercase text-slate-400">Active Alerts</p>
                          </div>
                        </div>
                        <div className="mt-4 flex flex-col gap-2 sm:flex-row">
                          <input className={`${inputCls} mt-0 flex-1`} placeholder="Search users" value={query} onChange={(e) => setQuery(e.target.value)} />
                          <button onClick={() => downloadJSON('users.json', users)} className="rounded bg-slate-100 px-3 py-2 text-xs font-semibold dark:bg-slate-800">Export Users</button>
                          <button onClick={() => downloadJSON('sos_logs.json', sos)} className="rounded bg-slate-100 px-3 py-2 text-xs font-semibold dark:bg-slate-800">Export SOS</button>
                        </div>
                      </section>

                      <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        <h3 className="font-display text-base font-bold">Broadcast Alert</h3>
                        <form onSubmit={broadcastAlert} className="mt-3 space-y-3">
                          <div className="flex gap-2">
                            <input className={`${inputCls} mt-0 flex-1`} placeholder="Alert Title" value={alertDraft.title} onChange={(e) => setAlertDraft({ ...alertDraft, title: e.target.value })} />
                            <select className={`${inputCls} mt-0 w-32`} value={alertDraft.severity} onChange={(e) => setAlertDraft({ ...alertDraft, severity: e.target.value })}>
                              <option value="info">Info</option>
                              <option value="warning">Warning</option>
                              <option value="danger">Danger</option>
                            </select>
                          </div>
                          <textarea className={`${inputCls} min-h-[60px]`} placeholder="Alert details..." value={alertDraft.message} onChange={(e) => setAlertDraft({ ...alertDraft, message: e.target.value })} />
                          <button type="submit" className="w-full rounded-lg bg-brand-600 py-2.5 font-semibold text-white hover:bg-brand-700">Broadcast Alert</button>
                        </form>
                        {alertStatus && <p className="mt-2 text-sm font-medium text-brand-600">{alertStatus}</p>}
                      </section>

                      <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-[#0b1f2e]">
                        <h3 className="font-display text-base font-bold">Security</h3>
                        <div className="mt-3 flex gap-2">
                          <input className={`${inputCls} mt-0`} type="password" placeholder="New admin password" value={newPass} onChange={(e) => setNewPass(e.target.value)} />
                          <button onClick={changePass} className="rounded-lg bg-brand-600 px-4 font-semibold text-white">Update</button>
                        </div>
                        {securityStatus && <p className="mt-2 text-sm font-medium text-brand-600">{securityStatus}</p>}
                      </section>
                    </>
                  )}
                </aside>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
